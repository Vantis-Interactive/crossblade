# Toolchain manifest. Install with `rokit install` (https://github.com/rojo-rbx/rokit).
# Versions are pinned; these are the exact versions used to build and test this repository.
# All four tools are also published on crates.io and can be installed with `cargo install`
# (see docs/DEPLOYMENT.md) when GitHub release downloads are unavailable.
[tools]
rojo = "rojo-rbx/rojo@7.7.1"
lune = "lune-org/lune@0.11.1"
stylua = "JohnnyMorganz/StyLua@2.6.0"
selene = "Kampfkarren/selene@0.31.0"
