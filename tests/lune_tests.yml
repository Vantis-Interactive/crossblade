# Extra globals available only in the Lune test harness (tests/**).
base: roblox_min
name: lune_tests
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  beforeEach:
    args:
      - type: function
  Runtime: { any: true }
  MemoryDataStore: { any: true }
  MemorySortedMap: { any: true }
